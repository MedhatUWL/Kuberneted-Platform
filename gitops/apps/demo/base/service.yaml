apiVersion: v1
kind: Service
metadata:
  name: platform-demo-stable
spec:
  selector:
    app.kubernetes.io/name: platform-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: platform-demo-canary
spec:
  selector:
    app.kubernetes.io/name: platform-demo
  ports:
    - name: http
      port: 80
      targetPort: http
