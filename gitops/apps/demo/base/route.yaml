apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-demo
spec:
  parentRefs:
    - name: public
  hostnames:
    - demo.<your-domain.example>
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: platform-demo-stable
          port: 80
          weight: 100
        - name: platform-demo-canary
          port: 80
          weight: 0
